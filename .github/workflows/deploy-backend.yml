name: Deploy Backend to Digital Ocean

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,xml,ctype,iconv,intl,pdo_mysql,dom,filter,gd,json,pdo
          tools: composer:v2

      - name: Create required Laravel directories
        run: |
          mkdir -p backend/bootstrap/cache
          mkdir -p backend/storage/framework/{views,cache,sessions}
          mkdir -p backend/storage/logs
          chmod -R 775 backend/bootstrap/cache backend/storage

      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
        env:
          COMPOSER_PROCESS_TIMEOUT: 600
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Vite assets
        working-directory: ./backend
        run: |
          npm install
          npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files via rsync
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'storage/framework/views/*' \
            --exclude 'storage/framework/cache/*' \
            --exclude 'bootstrap/cache/*.php' \
            backend/ ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/var/www/tickets-backend/backend/

      - name: Run post-deploy commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /var/www/tickets-backend/backend

            # Ensure storage directories exist
            mkdir -p storage/app/public
            mkdir -p storage/framework/{views,cache,sessions}
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            # Fix permissions
            chown -R www-data:www-data /var/www/tickets-backend/backend
            chmod -R 755 /var/www/tickets-backend/backend
            chmod -R 775 storage bootstrap/cache

            # Clear stale cache before running artisan
            rm -f bootstrap/cache/packages.php
            rm -f bootstrap/cache/services.php
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/routes*.php

            # Laravel optimisation
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            php artisan storage:link || true

            echo "Backend deployment complete."

      - name: Deployment completed
        run: |
          echo "Deployment completed"
          echo "If you need to set permissions on server, run:"
          echo "  chmod -R 775 storage bootstrap/cache"
          echo "  php artisan optimize:clear"
