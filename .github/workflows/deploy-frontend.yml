name: Deploy Frontend to Digital Ocean

on:
  push:
    branches: [ main ]
    paths: 
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build React app
      working-directory: ./frontend
      run: npm run build

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy files via rsync
      run: |
        rsync -az --delete \
          --exclude '.git' \
          --exclude 'node_modules' \
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          frontend/build/ ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/var/www/tickets-frontend/

    - name: Verify deployment
      run: |
        echo "Frontend deployed successfully to https://tickets.tfcmockup.com/"
        curl -f https://tickets.tfcmockup.com/ || echo "Warning: site check failed (may need DNS propagation)"